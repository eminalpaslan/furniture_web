# Lokal geliştirme servisleri (ROADMAP F0.3). Üretim altyapısı F12'de ayrıca tanımlanır.
#
# Host portları "1 + standart port" kuralıyla yayınlanır (5432 → 15432 …): aynı makinedeki başka
# projelerin Postgres/Mailpit'iyle çakışmasın diye. Hepsi .env ile değiştirilebilir.
# Portlar yalnızca 127.0.0.1'e açılır: şifreler herkesçe bilinen geliştirme şifreleri olduğu için aynı ağdaki
# (ör. kafe Wi-Fi'ı) başka bilgisayarlar bu servislere bağlanamasın.
# Buradaki kullanıcı adı/şifreler yalnızca lokal geliştirme içindir; gerçek ortamlarda gizli yöneticiden gelir.
#
# İmaj etiketleri tam sürümle sabitlenir (docs/STACK.md).

name: mobilya

services:
  postgres:
    # Entegrasyon testleri aynı imajı kullanır: apps/api/test/support/postgres.ts — sürüm ikisinde birlikte değişir.
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mobilya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobilya_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mobilya}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432'
    volumes:
      # Postgres 18 imajı veriyi /var/lib/postgresql/18/docker altında tutar; volume üst dizine bağlanır.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8.4-alpine3.23
    # appendonly: kuyruktaki işler (BullMQ) konteyner yeniden başlayınca kaybolmasın.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.56.2
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-mobilya_dev_master_key_32_chars_x}
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '127.0.0.1:${MEILI_HOST_PORT:-17700}:7700'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 uyumlu nesne deposu. MinIO'nun açık kaynak deposu arşivlendiği için RustFS (ADR-006).
  s3:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-mobilya}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-mobilya_dev_secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:${S3_HOST_PORT:-19000}:9000'
      - '127.0.0.1:${S3_CONSOLE_HOST_PORT:-19001}:9001'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Tek seferlik iş: bucket yoksa oluşturur, varsa dokunmaz; sonra kapanır.
  # `up` ile kendiliğinden başlamaz (profil); `pnpm infra:up` onu servisler sağlıklı olduktan sonra
  # `docker compose run` ile senkron çalıştırır, böylece hata olursa komut başarısız olur.
  # (RustFS 1.0.5'in yerleşik bucket bootstrap'ı paketlenmiş CLI eksik olduğu için çalışmıyor — ADR-006.)
  s3-init:
    image: amazon/aws-cli:2.40.1
    profiles: ['init']
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mobilya}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mobilya_dev_secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:9000
      S3_BUCKET: ${S3_BUCKET:-media}
    entrypoint: ['sh', '-c']
    command:
      - >-
        aws s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null
        && echo "bucket $$S3_BUCKET zaten var"
        || aws s3api create-bucket --bucket "$$S3_BUCKET"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '127.0.0.1:${SMTP_HOST_PORT:-11025}:1025'
      - '127.0.0.1:${MAILPIT_UI_HOST_PORT:-18025}:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  meili-data:
  s3-data:
  mailpit-data:
