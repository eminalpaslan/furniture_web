# Sürekli entegrasyon (ROADMAP F0.8): her PR'da ve main'e her push'ta CLAUDE.md §4.1 kapıları çalışır.
# Adımlar yereldeki pnpm scriptleriyle birebir aynıdır; CI'a özel komut yoktur.
# Action'lar sürüm etiketi yerine commit SHA'sıyla sabitlenir (etiket sonradan değiştirilemesin diye); yorumda sürüm yazar.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Aynı dalda yeni bir push gelince eski çalıştırma iptal edilir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify-and-e2e:
    name: Doğrulama ve e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node kur (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: pnpm kur (package.json → packageManager) ve mağaza önbelleği
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      # Lokal servislerle aynı değerler; CI'da gizli bilgi yoktur (gerçek anahtarlar F12'de gizli yöneticiden).
      - name: Ortam dosyasını hazırla
        run: cp .env.example .env

      - name: Biçim kontrolü
        run: pnpm format:check

      - name: Doğrula (typecheck, lint, test, build)
        run: pnpm verify

      - name: Ölü kod kontrolü
        run: pnpm knip

      - name: Lokal servisleri başlat
        run: pnpm infra:up

      - name: Playwright tarayıcısını kur
        run: pnpm --filter @mobilya/e2e exec playwright install --with-deps chromium

      - name: Uçtan uca testler (erişilebilirlik dahil)
        run: pnpm e2e

      - name: Playwright raporunu yükle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
