packages:
  - apps/*
  - packages/*
  - e2e

# Sürümler package.json'a tam (^/~ olmadan) yazılır — CLAUDE.md §3 sürüm politikası.
saveExact: true

# pnpm, yeni yayınlanmış sürümleri tedarik zinciri saldırılarına karşı bir süre bekletir (minimumReleaseAge).
# Sürüm politikamız "doğrulama günündeki en güncel kararlı sürüm" olduğu için, bilinçli olarak
# sabitlenen sürümler burada tek tek istisna edilir. Bkz. docs/DECISIONS.md ADR-005.
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.11'
  - '@turbo/darwin-arm64@2.11.11'
  - '@turbo/linux-64@2.11.11'
  - '@turbo/linux-arm64@2.11.11'
  - '@turbo/windows-64@2.11.11'
  - '@turbo/windows-arm64@2.11.11'
  - turbo@2.11.11
  - prettier@3.10.1
  - '@nestjs/common@12.5.0'
  - '@nestjs/core@12.5.0'
  - '@nestjs/platform-express@12.5.0'
  - '@nestjs/testing@12.5.0'

# Bağımlılıkların kurulum sırasında kod (install/postinstall betiği) çalıştırması varsayılan olarak kapalıdır.
# Buradakiler bilinçli olarak REDDEDİLDİ: üçü de Testcontainers'ın Docker bağlantı zincirinden gelen isteğe bağlı
# derlemeler / uyarılar; çalışmaları gerekmez. Bkz. docs/DECISIONS.md (F0.9 bağımlılık kaydı).
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
